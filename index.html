
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Solutions</title>

<style>
body {
    font-family: Arial;
    background-color: white;
    margin: 30px;
    color: black;
}

h1 {
    text-align: center;
    font-size: 28px;
}

p {
    text-align: center;
}

.language {
    text-align: right;
}

button, select, textarea {
    font-family: Arial;
    padding: 8px;
}

.form {
    width: 80%;
    max-width: 600px;
    margin: 30px auto;
}

select, textarea {
    width: 100%;
    margin-top: 8px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

textarea {
    height: 100px;
}

#ideas {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.idea {
    border: 1px solid gray;
    padding: 12px;
    width: 180px;
    min-height: 60px;
    background-color: #f7f7f7;
    overflow-wrap: anywhere;
}

.category {
    font-size: 12px;
    color: gray;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="language">
    <button onclick="changeLanguage()">한국어 / English</button>
</div>

<h1 id="title">Our Solutions for a Better World</h1>

<p id="intro">
Choose a problem and write your solution.
</p>

<div class="form">

<label id="problemLabel">Choose a social problem</label>
<br><br>

<select id="problem">
  <option value="Discrimination" data-en="Discrimination" data-ko="차별">Discrimination</option>
  <option value="Privilege" data-en="Privilege" data-ko="특권">Privilege</option>
  <option value="Advocacy" data-en="Advocacy" data-ko="옹호">Advocacy</option>
  <option value="Environmental Degradation" data-en="Environmental Degradation" data-ko="환경 파괴">Environmental Degradation</option>
  <option value="Tyranny" data-en="Tyranny" data-ko="폭정">Tyranny</option>
</select>

<label id="ideaLabel">Write your solution</label>
<br><br>

<textarea id="idea" maxlength="500"
placeholder="Write here..."></textarea>

<br>

<button id="submitButton" onclick="addIdea()">Submit</button>

<p id="message"></p>

</div>

<h2 id="ideasTitle">Solutions from People</h2>

<div id="ideas">
    <p>Solutions will appear here.</p>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    limit,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyC5oEsTnCqDmiR2lvZ2iNsxDVWh7a_XTNQ",
  authDomain: "bimspc.firebaseapp.com",
  projectId: "bimspc",
  storageBucket: "bimspc.firebasestorage.app",
  messagingSenderId: "486060537831",
  appId: "1:486060537831:web:bb623ac9e6d4a425b1ef42",
  measurementId: "G-1T41J3RS0D"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Firebase 컬렉션 이름
const ideasRef = collection(db, "solutions");

const BAD_WORD_URLS = [
  "https://cdn.jsdelivr.net/gh/hlog2e/bad_word_list@master/word_list.json",
  "https://raw.githubusercontent.com/dsojevic/profanity-list/main/en.txt"
];

let badWords = [];

async function loadBadWords() {
  try {
    const responses = await Promise.all(
      BAD_WORD_URLS.map(url => fetch(url))
    );

    if (responses.some(response => !response.ok)) {
      throw new Error("금칙어 목록 다운로드 실패");
    }

    const koreanData = await responses[0].json();
    const englishText = await responses[1].text();

    const koreanWords = Array.isArray(koreanData)
      ? koreanData
      : Object.values(koreanData).flat();

    const englishWords = englishText.split(/\r?\n/);

    badWords = [...koreanWords, ...englishWords]
      .filter(word => typeof word === "string")
      .map(word => word.trim().toLowerCase())
      .filter(Boolean);

    badWords = [...new Set(badWords)];

    console.log("금칙어 로딩 완료:", badWords.length);

  } catch (error) {
    console.error("금칙어 로딩 실패:", error);
    badWords = [];
  }
}

function containsBadWord(text) {
  const normalized = text.toLowerCase();

  return badWords.some(word => {
    // 영어는 독립된 단어인지 검사
    if (/^[a-z]+$/i.test(word)) {
      const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp(`(^|[^a-z])${escaped}([^a-z]|$)`, "i")
        .test(normalized);
    }

    // 한국어 및 초성 표현 검사
    return normalized.includes(word);
  });
}

// 목록 로딩을 시작하되, 페이지 실행을 기다리게 하지는 않음
const badWordsReady = loadBadWords();
 
let korean = false;
let ideas = [];


// 사회 문제 번역
function translateProblem(problem) {

    if (!korean) {
        return problem;
    }

    const translations = {
        "Discrimination": "차별",
        "Privilege": "특권",
        "Advocacy": "옹호",
        "Environmental Degradation": "환경 파괴",
        "Tyranny": "폭정"
    };

    return translations[problem] || problem;
}


// 언어 변경
window.changeLanguage = function() {

    korean = !korean;

    // 사회 문제 선택 목록 번역
    document.querySelectorAll("#problem option").forEach(option => {
        option.textContent = option.dataset[korean ? "ko" : "en"];
    });

    document.getElementById("title").innerText =
        korean ? "더 나은 세상을 위한 우리들의 생각" :
        "Our Solutions for a Better World";

    document.getElementById("intro").innerText =
        korean ? "사회 문제를 선택하고 해결 방법을 적어 보세요." :
        "Choose a problem and write your solution.";

    document.getElementById("problemLabel").innerText =
        korean ? "사회 문제 선택" :
        "Choose a social problem";

    document.getElementById("ideaLabel").innerText =
        korean ? "해결 방법 쓰기" :
        "Write your solution";

    document.getElementById("idea").placeholder =
        korean ? "여기에 적으세요..." :
        "Write here...";

    document.getElementById("submitButton").innerText =
        korean ? "제출" : "Submit";

    document.getElementById("ideasTitle").innerText =
        korean ? "사람들의 해결책" :
        "Solutions from People";

    showIdeas();
};


// 해결책 제출
window.addIdea = async function() {

    const text = document.getElementById("idea").value.trim();
    const problem = document.getElementById("problem").value;
    const message = document.getElementById("message");

    if (text === "") {
        message.innerText =
            korean ? "내용을 입력하세요." : "Please write something.";
        return;
    }
    
    await badWordsReady;
    
    if (badWords.length === 0) {
        message.innerText = korean
            ? "금칙어 목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."
            : "Could not load the word filter. Please try again.";
        return;
    }
    
    if (containsBadWord(text)) {
        message.innerText = korean
            ? "부적절한 표현이 포함되어 있습니다."
            : "Your text contains inappropriate language.";
        return;
    }

    try {

        await addDoc(ideasRef, {
            problem: problem,
            text: text,
            date: serverTimestamp()
        });

        document.getElementById("idea").value = "";

        message.innerText =
            korean ? "제출되었습니다!" : "Submitted!";

    } catch (error) {
    
        console.error("Submit error:", error);
    
        message.innerText = error.code + ": " + error.message;
    
    }

};


// 해결책 화면에 표시
function showIdeas() {

    const box = document.getElementById("ideas");
    box.innerHTML = "";

    ideas.forEach(function(item) {

        const card = document.createElement("div");
        card.className = "idea";

        const category = document.createElement("div");
        category.className = "category";
        category.innerText = translateProblem(item.problem);

        const text = document.createElement("div");
        text.innerText = item.text;

        card.appendChild(category);
        card.appendChild(text);

        box.appendChild(card);

    });

    if (ideas.length === 0) {

        const empty = document.createElement("p");

        empty.innerText =
            korean ? "해결책이 여기에 표시됩니다." :
            "Solutions will appear here.";

        box.appendChild(empty);
    }

}


// Firebase에서 해결책 불러오기
const q = query(
    ideasRef,
    orderBy("date", "desc"),
    limit(40)
);

onSnapshot(q, function(snapshot) {

    ideas = [];

    snapshot.forEach(function(doc) {
        ideas.push(doc.data());
    });

    showIdeas();

}, function(error) {

    console.error("Firebase error:", error);

    document.getElementById("ideas").innerText =
        korean ? "해결책을 불러오지 못했습니다." :
        "Could not load solutions.";

});

</script>

</body>
</html>
