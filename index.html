
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Our Solutions</title>

<style>
body {
    font-family: Arial;
    background-color: white;
    margin: 30px;
    color: black;
}

h1 {
    text-align: center;
    font-size: 28px;
}

p {
    text-align: center;
}

.language {
    text-align: right;
}

button, select, textarea {
    font-family: Arial;
    padding: 8px;
}

.form {
    width: 80%;
    max-width: 600px;
    margin: 30px auto;
}

select, textarea {
    width: 100%;
    margin-top: 8px;
    margin-bottom: 15px;
    box-sizing: border-box;
}

textarea {
    height: 100px;
}

#ideas {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.idea {
    border: 1px solid gray;
    padding: 12px;
    width: 180px;
    min-height: 60px;
    background-color: #f7f7f7;
    overflow-wrap: anywhere;
}

.category {
    font-size: 12px;
    color: gray;
    margin-bottom: 8px;
}
</style>
</head>

<body>

<div class="language">
    <button onclick="changeLanguage()">한국어 / English</button>
</div>

<h1 id="title">Our Solutions for a Better World</h1>

<p id="intro">
Choose a problem and write your solution.
</p>

<div class="form">

<label id="problemLabel">Choose a social problem</label>
<br><br>

<select id="problem">
  <option value="Discrimination" data-en="Discrimination" data-ko="차별">Discrimination</option>
  <option value="Privilege" data-en="Privilege" data-ko="특권">Privilege</option>
  <option value="Advocacy" data-en="Advocacy" data-ko="옹호">Advocacy</option>
  <option value="Environmental Degradation" data-en="Environmental Degradation" data-ko="환경 파괴">Environmental Degradation</option>
  <option value="Tyranny" data-en="Tyranny" data-ko="폭정">Tyranny</option>
</select>

<label id="ideaLabel">Write your solution</label>
<br><br>

<textarea id="idea" maxlength="500"
placeholder="Write here..."></textarea>

<br>

<button id="submitButton" onclick="addIdea()">Submit</button>

<p id="message"></p>

</div>

<h2 id="ideasTitle">Solutions from People</h2>

<div id="ideas">
    <p>Solutions will appear here.</p>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    onSnapshot,
    query,
    orderBy,
    limit,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyC5oEsTnCqDmiR2lvZ2iNsxDVWh7a_XTNQ",
  authDomain: "bimspc.firebaseapp.com",
  projectId: "bimspc",
  storageBucket: "bimspc.firebasestorage.app",
  messagingSenderId: "486060537831",
  appId: "1:486060537831:web:bb623ac9e6d4a425b1ef42",
  measurementId: "G-1T41J3RS0D"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// Firebase 컬렉션 이름
const ideasRef = collection(db, "solutions");

let korean = false;
// 부적절한 단어 목록
const badWords = [

    // 한국어 욕설 및 비하 표현
    "시발", "씨발", "ㅅㅂ", "ㅆㅂ",
    "병신", "븅신", "ㅂㅅ",
    "지랄", "ㅈㄹ",
    "개새끼", "새끼", "씹새끼",
    "좆", "존나", "졸라",
    "꺼져", "닥쳐", "엿먹어",
    "미친놈", "미친년", "또라이",
    "쓰레기", "벌레",

    // 영어 욕설 및 비하 표현
    "fuck", "fucking", "shit",
    "bitch", "bastard", "asshole",
    "dick", "damn", "crap",
    "motherfucker", "stfu",
    "idiot", "moron", "stupid",

    // 혐오 및 차별 표현
    "racist", "nazi", "retard",
    "go kill yourself",
    "you are worthless",
    "hate you",

    // 괴롭힘 및 위협 표현
    "죽여버린다",
    "죽어",
    "죽이고 싶다",
    "때려죽인다",
    "가만두지 않겠다",
    "찾아가서 혼내준다",
    "괴롭혀주겠다"
];

// 부적절한 단어 검사
function containsBadWord(text) {

    const lowerText = text.toLowerCase();

    return badWords.some(word =>
        lowerText.includes(word.toLowerCase())
    );

}
let ideas = [];


// 사회 문제 번역
function translateProblem(problem) {

    if (!korean) {
        return problem;
    }

    const translations = {
        "Discrimination": "차별",
        "Privilege": "특권",
        "Advocacy": "옹호",
        "Environmental Degradation": "환경 파괴",
        "Tyranny": "폭정"
    };

    return translations[problem] || problem;
}


// 언어 변경
window.changeLanguage = function() {

    korean = !korean;

    // 사회 문제 선택 목록 번역
    document.querySelectorAll("#problem option").forEach(option => {
        option.textContent = option.dataset[korean ? "ko" : "en"];
    });

    document.getElementById("title").innerText =
        korean ? "더 나은 세상을 위한 우리들의 생각" :
        "Our Solutions for a Better World";

    document.getElementById("intro").innerText =
        korean ? "사회 문제를 선택하고 해결 방법을 적어 보세요." :
        "Choose a problem and write your solution.";

    document.getElementById("problemLabel").innerText =
        korean ? "사회 문제 선택" :
        "Choose a social problem";

    document.getElementById("ideaLabel").innerText =
        korean ? "해결 방법 쓰기" :
        "Write your solution";

    document.getElementById("idea").placeholder =
        korean ? "여기에 적으세요..." :
        "Write here...";

    document.getElementById("submitButton").innerText =
        korean ? "제출" : "Submit";

    document.getElementById("ideasTitle").innerText =
        korean ? "사람들의 해결책" :
        "Solutions from People";

    showIdeas();
};


// 해결책 제출
window.addIdea = async function() {

    const text = document.getElementById("idea").value.trim();
    const problem = document.getElementById("problem").value;
    const message = document.getElementById("message");

    if (text === "") {
        message.innerText =
            korean ? "내용을 입력하세요." : "Please write something.";
        return;
    }
    
    if (containsBadWord(text)) {

        message.innerText =
            korean
            ? "부적절한 표현이 포함되어 있습니다. 수정해 주세요."
            : "Your text contains inappropriate words. Please edit it.";

        return;
    }

    try {

        await addDoc(ideasRef, {
            problem: problem,
            text: text,
            date: serverTimestamp()
        });

        document.getElementById("idea").value = "";

        message.innerText =
            korean ? "제출되었습니다!" : "Submitted!";

    } catch (error) {
    
        console.error("Submit error:", error);
    
        message.innerText = error.code + ": " + error.message;
    
    }

};


// 해결책 화면에 표시
function showIdeas() {

    const box = document.getElementById("ideas");
    box.innerHTML = "";

    ideas.forEach(function(item) {

        const card = document.createElement("div");
        card.className = "idea";

        const category = document.createElement("div");
        category.className = "category";
        category.innerText = translateProblem(item.problem);

        const text = document.createElement("div");
        text.innerText = item.text;

        card.appendChild(category);
        card.appendChild(text);

        box.appendChild(card);

    });

    if (ideas.length === 0) {

        const empty = document.createElement("p");

        empty.innerText =
            korean ? "해결책이 여기에 표시됩니다." :
            "Solutions will appear here.";

        box.appendChild(empty);
    }

}


// Firebase에서 해결책 불러오기
const q = query(
    ideasRef,
    orderBy("date", "desc"),
    limit(40)
);

onSnapshot(q, function(snapshot) {

    ideas = [];

    snapshot.forEach(function(doc) {
        ideas.push(doc.data());
    });

    showIdeas();

}, function(error) {

    console.error("Firebase error:", error);

    document.getElementById("ideas").innerText =
        korean ? "해결책을 불러오지 못했습니다." :
        "Could not load solutions.";

});

</script>

</body>
</html>
